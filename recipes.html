<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/recipes.css">
    <script src="js/recipes.js" defer></script>

<body>
    <header>
        <h1>Intelligent Kitchen Management System</h1>
    </header>
    <div class="subheader">
        <h2>Recipe Suggestions</h2>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Dashboard</a></li>

    <main>
        <section class="recipe-section">
            <h2>Find Meals Based on Your Ingredients</h2>

            <div id="recipe-results" class="recipe-container"></div>
